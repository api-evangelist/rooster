name: Rooster
description: Rooster is a subscription mobile reading app built by Plympton, Inc., a
  literary studio co-founded by Jennifer 8. Lee, Yael Goldstein Love, and Jacky Chang.
  Rooster delivers serialized fiction to readers' phones in short, commute-sized installments
  for a flat monthly fee, drawing on Plympton's DailyLit heritage of serialized reading.
  It was surfaced as a portfolio company of 500 Global and added to the API Evangelist
  network. Rooster is a consumer-facing app; Plympton publishes no public API, SDK,
  developer portal, or webhook surface as of this enrichment pass.
